<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172C"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#primaryGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Shopping Bag / Store Frame -->
  <path d="M22 24C22 18.4772 26.4772 14 32 14C37.5228 14 42 18.4772 42 24" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Main Store / Box Body -->
  <rect x="15" y="24" width="34" height="26" rx="6" fill="url(#accentGrad)" filter="url(#drop)"/>

  <!-- Inward / Checkmark Badge -->
  <circle cx="39" cy="41" r="9" fill="url(#boxGrad)"/>
  <path d="M35.5 41L38 43.5L42.5 38.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- P Emblem on Box -->
  <path d="M23 31H28C29.6569 31 31 32.3431 31 34C31 35.6569 29.6569 37 28 37H23V43M23 31V43" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
